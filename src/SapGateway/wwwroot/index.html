<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAP Gateway — XML Inspector</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 2rem; max-width: 960px; margin-inline: auto;
    background: Canvas; color: CanvasText;
  }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { opacity: .65; margin-top: 0; font-size: .9rem; }
  .controls {
    display: flex; gap: .75rem; flex-wrap: wrap; align-items: end;
    padding: 1rem; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
    border-radius: 10px; margin-block: 1rem;
  }
  label { display: block; font-size: .8rem; opacity: .7; margin-bottom: .25rem; }
  select, button {
    font: inherit; padding: .5rem .9rem; border-radius: 8px;
    border: 1px solid color-mix(in srgb, CanvasText 25%, transparent);
    background: Canvas; color: CanvasText;
  }
  button { cursor: pointer; font-weight: 600; }
  button.primary { background: #0a6ed1; border-color: #0a6ed1; color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  .badge {
    display: inline-block; font-weight: 700; font-size: 1.1rem;
    padding: .35rem .9rem; border-radius: 8px; color: #fff;
  }
  .badge.ok   { background: #188918; }
  .badge.warn { background: #e76500; }
  .badge.err  { background: #bb0000; }
  .meta { font-size: .85rem; opacity: .75; margin-top: .4rem; }
  ul.messages { padding-left: 1.2rem; }
  ul.messages li { margin-block: .25rem; }
  pre {
    background: color-mix(in srgb, CanvasText 6%, transparent);
    padding: 1rem; border-radius: 8px; overflow: auto; max-height: 480px;
    font-size: .8rem; line-height: 1.45;
  }
  .hidden { display: none; }
  section { margin-top: 1.5rem; }
  h2 { font-size: 1rem; margin-bottom: .5rem; }
</style>
</head>
<body>
  <h1>SAP Gateway — XML Inspector</h1>
  <p class="sub">
    Requests go to <code>/sap/{destination}/{scenario}</code> → gateway middleware → SAP (basic auth)
    → invalid-character inspection → XML validation → JSON transform → status code set
    <em>after</em> the payload was read.
  </p>

  <div class="controls">
    <div>
      <label for="destination">SAP destination</label>
      <select id="destination"></select>
    </div>
    <div>
      <label for="scenario">Path on that system</label>
      <select id="scenario">
        <option value="valid">valid — well-formed sales order</option>
        <option value="invalid-char">invalid-char — contains 0x0B vertical tab</option>
        <option value="malformed">malformed — unclosed tags</option>
        <option value="error">error — SAP replies HTTP 500 with XML</option>
        <option value="large">large — ~2&nbsp;MB catalog (memory test)</option>
      </select>
      <input id="customPath" class="hidden" type="text" placeholder="?sap_client=800&sap-language=EN&function=%2FENSX%2FBUSOBJ_GET" style="min-width:220px" />
    </div>
    <div id="bodyWrap" class="hidden" style="flex:1 1 100%">
      <label for="requestBody">Request body (XML)</label>
      <textarea id="requestBody" rows="5" style="width:100%;font-family:monospace;padding:.5rem;border-radius:8px;border:1px solid color-mix(in srgb, CanvasText 25%, transparent);background:Canvas;color:CanvasText"><PARAM>
  <I_TYPE>EnosixSalesDocument</I_TYPE>
  <I_KEY>29039</I_KEY>
</PARAM></textarea>
    </div>
    <button id="send" class="primary">Send request</button>
  </div>

  <section id="result" class="hidden">
    <h2>Response</h2>
    <span id="statusBadge" class="badge"></span>
    <div class="meta" id="meta"></div>
    <h2>Messages</h2>
    <ul class="messages" id="messages"></ul>
    <h2>Payload (XML → JSON)</h2>
    <pre id="payload"></pre>
  </section>

<script type="module">
  const sendBtn = document.getElementById('send');
  const destSelect = document.getElementById('destination');
  const scenarioSelect = document.getElementById('scenario');
  const customPathInput = document.getElementById('customPath');
  const bodyWrap = document.getElementById('bodyWrap');
  const requestBodyEl = document.getElementById('requestBody');
  const resultEl = document.getElementById('result');
  const badgeEl = document.getElementById('statusBadge');
  const metaEl = document.getElementById('meta');
  const messagesEl = document.getElementById('messages');
  const payloadEl = document.getElementById('payload');

  // Load the configured SAP destinations.
  let destinations = [];
  try {
    destinations = await fetch('/api/destinations').then(r => r.json());
  } catch { destinations = []; }

  for (const d of destinations) {
    const opt = document.createElement('option');
    opt.value = d.name;
    opt.textContent = `${d.name}${d.isMock ? ' (mock)' : ''}${d.hasCredentials ? ' 🔒' : ''}` +
      (d.description ? ` — ${d.description}` : '');
    destSelect.appendChild(opt);
  }
  if (destinations.length === 0) {
    const opt = document.createElement('option');
    opt.value = 'self';
    opt.textContent = 'self (mock)';
    destSelect.appendChild(opt);
  }

  // Scenario list only makes sense for the mock system; for real destinations
  // offer a free-form path input instead.
  function updatePathControl() {
    const d = destinations.find(x => x.name === destSelect.value);
    const mock = !d || d.isMock;
    scenarioSelect.classList.toggle('hidden', !mock);
    customPathInput.classList.toggle('hidden', mock);
    bodyWrap.classList.toggle('hidden', mock);
  }
  destSelect.addEventListener('change', updatePathControl);
  updatePathControl();

  sendBtn.addEventListener('click', async () => {
    const d = destinations.find(x => x.name === destSelect.value);
    const mock = !d || d.isMock;
    const path = mock
      ? scenarioSelect.value
      : customPathInput.value.trim().replace(/^\/+/, '');
    sendBtn.disabled = true;
    resultEl.classList.add('hidden');
    const started = performance.now();

    try {
      // Browsers forbid a body on GET, so real calls with a body go as POST;
      // the gateway forwards the method (and body) to SAP unchanged.
      const body = mock ? '' : requestBodyEl.value.trim();
      const res = await fetch(`/sap/${encodeURIComponent(destSelect.value)}/${path}`, body
        ? { method: 'POST', headers: { 'Content-Type': 'application/xml' }, body }
        : {});
      const json = await res.json();
      const elapsed = (performance.now() - started).toFixed(0);

      badgeEl.textContent = res.status + ' ' + statusText(res.status);
      badgeEl.className = 'badge ' + (res.status < 300 ? 'ok' : res.status < 500 ? 'warn' : 'err');
      metaEl.textContent =
        `Destination: ${json.destination ?? destSelect.value} · Upstream SAP status: ${json.sapStatusCode} · ${elapsed} ms · ${json.upstream}`;

      messagesEl.innerHTML = '';
      for (const m of json.messages ?? []) {
        const li = document.createElement('li');
        li.textContent = m;
        messagesEl.appendChild(li);
      }
      payloadEl.textContent = json.payload
        ? JSON.stringify(json.payload, null, 2)
        : '(no payload — validation failed)';
      resultEl.classList.remove('hidden');
    } catch (err) {
      badgeEl.textContent = 'NETWORK ERROR';
      badgeEl.className = 'badge err';
      metaEl.textContent = String(err);
      messagesEl.innerHTML = '';
      payloadEl.textContent = '';
      resultEl.classList.remove('hidden');
    } finally {
      sendBtn.disabled = false;
    }
  });

  function statusText(code) {
    const map = { 200: 'OK', 400: 'Bad Request', 401: 'Unauthorized', 404: 'Not Found', 500: 'Internal Server Error', 502: 'Bad Gateway' };
    return map[code] ?? '';
  }
</script>
</body>
</html>
